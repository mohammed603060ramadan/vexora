name: Refresh and validate security dependency lockfile

on:
  pull_request:
    branches:
      - master
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/refresh-security-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/harden-api-endpoints-2026-11-12'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact locked dependencies
        run: npm ci

      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const report = require('./npm-audit.json');
          const summary = report.metadata?.vulnerabilities ?? {};
          console.log('Dependency audit summary:', JSON.stringify(summary));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              range: item.range,
              via: item.via.map((entry) => typeof entry === 'string' ? entry : entry.title),
              fixAvailable: item.fixAvailable
            }));
          }
          if ((summary.high ?? 0) > 0 || (summary.critical ?? 0) > 0) process.exit(1);
          NODE
          rm -f npm-audit.json

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Commit regenerated lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security(deps): regenerate patched dependency lockfile"
            git push origin "HEAD:refs/heads/${{ github.event.pull_request.head.ref }}"
          else
            echo "The lockfile is already synchronized."
          fi
