name: VEXORA CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: vexora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const report = require('./npm-audit.json');
          const summary = report.metadata?.vulnerabilities ?? {};
          console.log('Dependency audit summary:', JSON.stringify(summary));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const via = item.via.map((entry) => typeof entry === 'string' ? entry : entry.title);
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              range: item.range,
              via,
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
          rm -f npm-audit.json

      - name: Enforce dependency security threshold
        run: npm audit --audit-level=moderate

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build
