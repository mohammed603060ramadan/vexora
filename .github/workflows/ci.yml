name: VEXORA CI

on:
  push:
    branches:
      - master
      - fix/integrated-admin-client-db-audit-2026-10-27
      - fix/client-portal-live-data-and-ux-2026-10-28
      - fix/client-dashboard-schema-compat-2026-10-31
  pull_request:
    branches:
      - master
      - fix/integrated-admin-client-db-audit-2026-10-27
      - fix/client-portal-live-data-and-ux-2026-10-28

permissions:
  contents: read

concurrency:
  group: vexora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build
